// Root build script for the RIFTSTRIKE LevelPlay Godot Android v2 plugin.
// Versions are aligned with the Godot 4.7 Android build template
// (android/build/config.gradle): AGP 8.6.1, Kotlin 2.1.21, Gradle 8.11.1.
buildscript {
    ext.agpVersion = '8.6.1'
    ext.kotlinVersion = '2.1.21'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
