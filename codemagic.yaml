workflows:
  ios-testflight:
    name: iOS — Godot TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      groups:
        # App Store Connect API key (APP_STORE_CONNECT_* vars):
        - basic
      vars:
        BUNDLE_ID: com.lishistudio.riftwing
        APPLE_DEVELOPMENT_TEAM: 7BLH4NFZDD
        GODOT_VERSION: 4.7-stable
        IOS_EXPORT_PRESET: iOS
        IOS_EXPORT_PATH: build/ios/riftwing.ipa
        XCODE_PROJECT: build/ios/riftwing.xcodeproj
        BUILD_DIR: $CM_BUILD_DIR
        BUILD_NUMBER: $PROJECT_BUILD_NUMBER
        # Do NOT use `ios_signing` here — profiles are created at build time via
        # App Store Connect API (see .github/scripts/godot-ios-testflight-run.sh).
    scripts:
      - name: Run iOS TestFlight pipeline
        script: |
          set -euxo pipefail
          chmod +x .github/scripts/*.sh
          bash .github/scripts/setup-codemagic-cli.sh
          bash .github/scripts/godot-ios-testflight-run.sh
    artifacts:
      - $CM_BUILD_DIR/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build.xcarchive
      - $CM_BUILD_DIR/xcodebuild-archive.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only — external beta review needs Beta App Information in ASC.
        # Flip to true after feedback email + beta contact are filled.
        submit_to_testflight: false
