# iOS — Godot 4.7 TestFlight (manual: export → sign → App Store Connect)
name: iOS — Godot TestFlight

on:
  workflow_dispatch:
    inputs:
      run_probes:
        description: 'Run export_validation + ads_service probes before export (slower)'
        type: boolean
        default: false
      upload_ipa_artifact:
        description: 'Upload IPA to GitHub Artifacts (uses storage quota; TestFlight does not need this)'
        type: boolean
        default: false
      submit_testflight_beta_review:
        description: 'Submit to external TestFlight beta review (requires Beta App Information in App Store Connect)'
        type: boolean
        default: false
      build_appetize:
        description: 'Also build iOS Simulator zip for Appetize'
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
  BUNDLE_ID: com.lishistudio.riftwing
  APPLE_DEVELOPMENT_TEAM: 7BLH4NFZDD
  GODOT_VERSION: 4.7-stable
  IOS_EXPORT_PRESET: iOS
  IOS_EXPORT_PATH: build/ios/riftwing.ipa
  XCODE_PROJECT: build/ios/riftwing.xcodeproj
  BUILD_DIR: ${{ github.workspace }}/build
  SIMULATOR_DERIVED_DATA: ${{ github.workspace }}/build/DerivedDataSimulator
  APPETIZE_STAGING_DIR: ${{ github.workspace }}/build/appetize-staging
  APPETIZE_ZIP: ${{ github.workspace }}/build/riftwing-simulator-appetize.zip
  # Apple already has CFBundleVersion 11; CI must stamp a strictly higher CURRENT_PROJECT_VERSION.
  IOS_BUILD_NUMBER_FLOOR: "12"
  IOS_BUILD_NUMBER_OFFSET: "0"
  APP_STORE_APPLE_ID: "6792694067"

jobs:
  build-and-publish:
    name: Build & publish TestFlight IPA
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name (see .github/GITHUB_ACTIONS_SETUP.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci-godot
            ~/Library/Application Support/Godot/export_templates/4.7.stable
          key: godot-${{ env.GODOT_VERSION }}-templates-v1
          restore-keys: |
            godot-${{ env.GODOT_VERSION }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/DerivedData
          key: derived-riftwing-${{ runner.os }}-${{ hashFiles('export_presets.cfg', 'project.godot', 'ios/plugins/*.gdip') }}
          restore-keys: |
            derived-riftwing-${{ runner.os }}-

      - name: Cache Codemagic CLI venv
        uses: actions/cache@v4
        with:
          path: .ci-venv
          key: ci-venv-${{ runner.os }}-${{ hashFiles('.github/scripts/ci-env.sh') }}
          restore-keys: |
            ci-venv-${{ runner.os }}-

      - name: Run iOS TestFlight pipeline
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RUN_PROBES: ${{ inputs.run_probes }}
          APP_STORE_APPLE_ID: ${{ env.APP_STORE_APPLE_ID }}
          IOS_BUILD_NUMBER_FLOOR: ${{ env.IOS_BUILD_NUMBER_FLOOR }}
          IOS_BUILD_NUMBER_OFFSET: ${{ env.IOS_BUILD_NUMBER_OFFSET }}
        run: bash .github/scripts/godot-ios-testflight-run.sh

      # Soft-fail: missing Beta App Information must not block later steps.
      - name: Publish to TestFlight
        continue-on-error: true
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SUBMIT_TESTFLIGHT_BETA_REVIEW: ${{ inputs.submit_testflight_beta_review }}
        run: bash .github/scripts/ios-publish-testflight.sh

      - name: Upload IPA artifact (optional)
        if: ${{ inputs.upload_ipa_artifact }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 3

      # Optional — off by default (same toggle as PEND / Tohav). Reuses the Godot-exported Xcode project.
      - name: Build iOS Simulator zip for Appetize
        if: ${{ inputs.build_appetize }}
        run: bash .github/scripts/ios-simulator-appetize.sh

      # Upload .app so GitHub wraps once; Appetize needs riftwing.app at the zip root.
      - name: Upload Appetize simulator .app
        if: ${{ inputs.build_appetize }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-appetize-${{ github.run_number }}
          path: ${{ env.APPETIZE_APP_PATH }}
          retention-days: 7
          compression-level: 9
          if-no-files-found: error

      - name: Upload Appetize flat zip
        if: ${{ inputs.build_appetize }}
        uses: actions/upload-artifact@v4
        with:
          name: appetize-zip-${{ github.run_number }}
          path: ${{ env.APPETIZE_ZIP }}
          retention-days: 7
          if-no-files-found: error
