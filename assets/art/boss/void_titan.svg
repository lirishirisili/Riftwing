<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8C43FF"/><stop offset="1" stop-color="#FF38F2"/></linearGradient>
  <linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFB000"/><stop offset="1" stop-color="#FF4B16"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#C9A0FF"/><stop offset="1" stop-color="#8C43FF"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
